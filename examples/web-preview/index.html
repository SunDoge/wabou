<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wabou Canvas Preview</title><link rel="icon" href="data:,"><style>
* { box-sizing: border-box; } body { margin: 0; background: #f4f5f7; color: #18202b; font: 14px system-ui,sans-serif; } header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid #dddfe4; background:white; } h1 { margin:0; font-size:16px; } #status { color:#536070; } main { margin:32px auto; max-width:960px; padding:0 24px; } canvas { width:100%; height:420px; display:block; background:white; border:1px solid #dddfe4; border-radius:12px; } p { color:#536070; line-height:1.6; } #error { color:#a21c26; white-space:pre-wrap; } @media(max-width:500px) { header { padding:12px; } main { padding:0 12px; margin:16px auto; } }
</style></head><body><header><h1>Wabou Canvas Preview</h1><span id="status" role="status">Loading…</span></header><main><canvas id="preview" tabindex="0" aria-label="Interactive counter preview"></canvas><p>Increment or reset the counter inside the canvas. Resize the window to check the layout.</p><pre id="error" role="alert"></pre></main><script>
const canvas = document.querySelector('#preview');
canvas.addEventListener('wabou:ready', () => document.querySelector('#status').textContent = 'Ready');
canvas.addEventListener('wabou:error', event => {
  document.querySelector('#status').textContent = 'Preview failed';
  document.querySelector('#error').textContent = String(event.detail);
});
</script></body></html>
