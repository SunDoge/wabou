[package]
name = "native-counter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wabou-native = { path = "../../wabou-native" }

[dev-dependencies]
wabou-native = { path = "../../wabou-native", features = ["testing"] }

[features]
native = ["wabou-native/native"]

[[bin]]
name = "native-counter"
path = "src/main.rs"
required-features = ["native"]

[package.metadata.blockui]
static-bin = "native-counter"

[package.metadata.wabou]
frontend = "rust"
