[package]
name = "wabou-launch"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
# Match stabby's loader range so a fresh resolution uses the same Library type.
libloading = ">=0.7.3, <0.10"
stabby = { version = "=72.1.16", features = ["libloading"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
