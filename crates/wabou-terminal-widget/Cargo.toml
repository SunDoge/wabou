[package]
name = "wabou-terminal-widget"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "Winit terminal widget for Wabou's native renderer."

[dependencies]
percent-encoding = "2"
rio-graphics = "0.5.28"
rio-vt = "0.5.28"
rustc-hash = "2"
serde_json = { workspace = true }
teletypewriter = "0.5.28"
tracing = { workspace = true }
vello-common.workspace = true
wabou-shell = { workspace = true }
wabou-protocol = { workspace = true }
wabou-shell-api = { workspace = true }
wabou-host-api.workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2"
