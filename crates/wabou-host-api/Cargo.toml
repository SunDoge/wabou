[package]
name = "wabou-host-api"
version.workspace = true
edition = "2024"
license.workspace = true

[features]
bindings = ["dep:specta", "dep:wabou-bindgen"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
specta = { workspace = true, optional = true }
wabou-bindgen = { workspace = true, optional = true }

[[example]]
name = "native-host-bindings"
path = "examples/native-host-bindings.rs"
required-features = ["bindings"]
