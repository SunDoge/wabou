[package]
name = "wabou-host-api"
version.workspace = true
edition = "2024"
license.workspace = true

[features]
bindings = [
  "dep:specta",
  "dep:specta-typescript",
  "dep:wabou-bindgen",
  "wabou-bindgen/generate",
]
specta = ["dep:specta", "dep:specta-typescript"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
wabou-bindgen = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "native-host-bindings"
path = "examples/native-host-bindings.rs"
required-features = ["bindings"]
