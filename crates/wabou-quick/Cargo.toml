[package]
name = "wabou-quick"
version = "0.1.0"
edition = "2024"

[lib]
name = "wabou_quick"
path = "src/lib.rs"

[[bin]]
name = "wabou-quick"
path = "src/bin/wabou-quick.rs"

[features]
# Live vite dev-server integration (module fetching + HMR). Step 2.
vite = ["dep:ureq", "dep:tungstenite"]

[dependencies]
wabou-shell = { path = "../wabou-shell" }
wabou-devtools = { path = "../wabou-devtools" }
wabou-style = { workspace = true }
vello = "0.9.0"
parley = "0.10"
taffy = { version = "0.12.2", features = ["parse", "content_size"] }
rquickjs = { version = "0.12.1", features = ["full-async", "rust-alloc", "loader"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures-lite = "2"
bon = { workspace = true }
bitflags = { workspace = true }
snafu = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6.4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
lasso = "0.7.3"
open = "5.4.0"

# vite feature only
ureq = { version = "3.3", optional = true }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"], optional = true }
