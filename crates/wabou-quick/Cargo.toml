[package]
name = "wabou-quick"
version = "0.1.0"
edition = "2024"

license.workspace = true

[lib]
name = "wabou_quick"
path = "src/lib.rs"

[dependencies]
bitflags = { workspace = true }
bon = { workspace = true }
foyer = "0.22.3"
futures-lite = "2"
lasso = "0.7.3"
open = { workspace = true }
parley = { workspace = true }
reqwest = {
  version = "0.12",
  default-features = false,
  features = ["rustls-tls"]
}
rquickjs = {
  version = "0.12.1",
  features = ["full-async", "loader", "rust-alloc"]
}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
snafu = { workspace = true }
taffy = { workspace = true, features = ["content_size", "parse"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
tracing-chrome = { version = "0.7.2", optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
vello = { workspace = true }
wabou-devtools = { workspace = true }
wabou-host-api = { workspace = true }
wabou-shell = { workspace = true }
wabou-style = { workspace = true }
wabou-widgets = { workspace = true }

tungstenite = {
  version = "0.28",
  default-features = false,
  features = ["handshake"],
  optional = true
}
# vite feature only
ureq = { version = "3.3", optional = true }

[features]
profiling = ["dep:tracing-chrome", "wabou-shell/profiling"]
# Live vite dev-server integration (module fetching + HMR). Step 2.
vite = ["dep:tungstenite", "dep:ureq"]

[dev-dependencies]
tempfile = "3"
