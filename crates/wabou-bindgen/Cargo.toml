[package]
name = "wabou-bindgen"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
serde = { workspace = true }
wabou-bindgen-macros.workspace = true
specta = { workspace = true, optional = true }
specta-serde = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }

[features]
default = ["generate"]
generate = [
  "dep:specta",
  "dep:specta-serde",
  "dep:specta-typescript",
]

[dev-dependencies]
rquickjs = { version = "0.14.0", features = ["macro"] }
serde = { workspace = true, features = ["derive"] }
