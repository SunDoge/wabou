[package]
name = "wabou-terminal-vello"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "Winit terminal widget for Wabou's Vello Hybrid backend."

[dependencies]
percent-encoding = "2"
rio-graphics = "0.5.5"
rio-vt = "0.5.5"
rustc-hash = "2"
serde_json = { workspace = true }
teletypewriter = "0.5.5"
tracing = { workspace = true }
vello-common.workspace = true
wabou-shell-vello = { workspace = true }
wabou-protocol = { workspace = true }
wabou-shell-api = { workspace = true }

[target."cfg(unix)".dependencies]
libc = "0.2"
