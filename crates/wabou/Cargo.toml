[package]
name = "wabou"
version.workspace = true
edition = "2024"
description = "Public Rust application API for the Wabou native SolidJS runtime."
readme = "README.md"
publish = false

license.workspace = true

[dependencies]
wabou-bindgen = { workspace = true }
wabou-database = { workspace = true }
wabou-runtime = { workspace = true, default-features = false }
wabou-legacy-runtime = { workspace = true, optional = true }
wabou-tray = { workspace = true, optional = true }

[features]
default = ["vello-hybrid"]
bindings = ["wabou-bindgen/generate"]
devtools = ["wabou-runtime/devtools", "wabou-legacy-runtime?/devtools"]
gpui = ["wabou-runtime/gpui"]
headless = ["wabou-runtime/headless"]
gpui-headless = ["gpui", "headless", "wabou-runtime/gpui-headless"]
profiling = ["wabou-runtime/profiling"]
rust-hot-reload = ["wabou-runtime/rust-hot-reload"]
tray = ["dep:wabou-tray"]
vite = ["wabou-runtime/vite", "wabou-legacy-runtime?/vite"]
vello-hybrid = ["dep:wabou-legacy-runtime"]
# Compatibility alias for applications created before Vello Hybrid became the default.
winit-vello-hybrid = ["vello-hybrid"]

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
