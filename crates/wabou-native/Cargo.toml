[package]
name = "wabou-native"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "Experimental Rust UI frontend for Wabou"

[dependencies]
blockui-icons-lucide = { path = "../blockui-icons-lucide", optional = true }
blockui = { path = "../blockui" }
blockui-test = { path = "../blockui-test", optional = true }
blockui-runtime = { path = "../blockui-runtime", optional = true, features = ["native-window", "static-app"] }

[features]
default = ["macros"]
macros = ["blockui/macros"]
rsx = ["macros", "blockui/rsx"]
testing = ["dep:blockui-test"]
native = ["dep:blockui-runtime"]
lucide = ["dep:blockui-icons-lucide"]

[dev-dependencies]
ui-contract = { path = "../ui-contract" }

[[test]]
name = "native_services"
required-features = ["native"]

[[test]]
name = "async_guide"
required-features = ["testing"]

[[test]]
name = "tag_ui_guide"
required-features = ["testing"]
