[package]
name = "wabou-backend-winit"
version.workspace = true
edition = "2024"

license.workspace = true

[lib]
name = "wabou_backend_winit"
path = "src/lib.rs"

[dependencies]
anyrender.workspace = true
anyrender-skia = { workspace = true, optional = true }
anyrender-svg.workspace = true
anyrender-vello.workspace = true
arboard = { workspace = true }
bitflags = { workspace = true }
directories = { workspace = true }
futures-util = "0.3"
image = { workspace = true, features = ["ico", "jpeg", "png", "webp"] }
lru = "0.18.1"
notify-rust = { workspace = true }
open = { workspace = true }
parley = { workspace = true }
raw-window-handle = "0.6"
rfd = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
slotmap = { workspace = true }
snafu = { workspace = true }
swash = { workspace = true }
taffy = { workspace = true, features = ["content_size", "parse"] }
tracing = { workspace = true }
unicode-segmentation = "1.12"
url = { workspace = true }
vello = { workspace = true }
winit = { workspace = true }
wabou-accessibility = { workspace = true }
wabou-host-api = { workspace = true }

[features]
profiling = []
renderer-skia = ["dep:anyrender-skia"]

[dev-dependencies]
tempfile = "3"
