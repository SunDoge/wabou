[package]
name = "wabou-render-core"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[features]
profiling = []

[dependencies]
bitflags = { workspace = true }
bytemuck.workspace = true
glifo = { workspace = true, features = ["png"] }
image = { workspace = true, features = ["ico", "jpeg", "png", "webp"] }
lru = "0.18.5"
naga.workspace = true
parley = { workspace = true }
rustc-hash = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snafu = { workspace = true }
taffy = { workspace = true, features = ["content_size", "parse"] }
tracing = { workspace = true }
unicode-segmentation = "1.13"
usvg.workspace = true
vello-common.workspace = true
vello-gpu = { workspace = true, features = ["text"] }
wabou-shell-api = { workspace = true }
wabou-motion = { workspace = true }
wabou-style = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
vello-gpu = { workspace = true, features = ["webgl", "text"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu.workspace = true
vello-gpu = { workspace = true, features = ["wgpu", "text"] }
