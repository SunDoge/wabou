[package]
name = "wabou-runtime"
version.workspace = true
edition = "2024"

license.workspace = true

[lib]
name = "wabou_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
anyrender.workspace = true
arc-swap = { workspace = true }
bitflags = { workspace = true }
bon = { workspace = true }
dioxus-devtools = { workspace = true, optional = true }
flume = { workspace = true }
futures-channel = { workspace = true }
futures-lite = "2"
getrandom = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
jiff = { workspace = true }
lasso = "0.7.3"
open = { workspace = true }
parley = { workspace = true }
reqwest = {
  version = "0.13",
  default-features = false,
  features = ["rustls"]
}
rquickjs = {
  version = "0.12.1",
  features = ["full-async", "loader", "rust-alloc"]
}
rquickjs-serde = "0.6.1"
serde = { workspace = true, features = ["derive"] }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
slotmap = { workspace = true }
sourcemap = "9.2.2"
sys-locale = { workspace = true }
taffy = { workspace = true, features = ["content_size", "parse"] }
tempfile = "3"
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
tracing-chrome = { version = "0.7.2", optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
vello = { workspace = true }
wabou-bindgen = { workspace = true }
wabou-database = { workspace = true }
wabou-devtools = { workspace = true, optional = true }
wabou-host-api = { workspace = true }
wabou-backend-winit = { workspace = true }
wabou-shell-gpui = { workspace = true }
gpui-base = { workspace = true }
wabou-style = { workspace = true }
wabou-backend-winit-widgets = { workspace = true }

tungstenite = {
  version = "0.28",
  default-features = false,
  features = ["handshake"],
  optional = true
}
# vite feature only
ureq = { version = "3.3", optional = true }

[features]
default = []
devtools = ["dep:wabou-devtools"]
profiling = ["dep:tracing-chrome", "wabou-backend-winit/profiling"]
renderer-skia = ["wabou-backend-winit/renderer-skia"]
rust-hot-reload = ["dep:dioxus-devtools"]
# Live vite dev-server integration (module fetching + HMR). Step 2.
vite = ["dep:tungstenite", "dep:ureq"]

[dev-dependencies]
gpui-platform.workspace = true
gpui = { workspace = true, features = ["test-support"] }
image = { workspace = true, features = ["png"] }
proptest = "1"
wabou-devtools = { workspace = true }
