[package]
name = "wabou-runtime"
version.workspace = true
edition = "2024"

license.workspace = true

[lib]
name = "wabou_runtime"
path = "src/lib.rs"

[dependencies]
arc-swap = { workspace = true }
dioxus-devtools = { workspace = true, optional = true }
flume = { workspace = true }
futures-lite = "2"
getrandom = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
jiff = { workspace = true }
open = { workspace = true }
reqwest = {
  version = "0.13",
  default-features = false,
  features = ["rustls"]
}
rquickjs = {
  version = "0.12.1",
  features = ["full-async", "loader", "rust-alloc"]
}
rquickjs-serde = "0.6.1"
serde = { workspace = true, features = ["derive"] }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
slotmap = { workspace = true }
sourcemap = "9.2.2"
sys-locale = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
wabou-bindgen = { workspace = true }
wabou-database = { workspace = true }
wabou-devtools = { workspace = true, optional = true }
wabou-host-api = { workspace = true }
wabou-protocol = { workspace = true }
wabou-shell-api.workspace = true
wabou-style = { workspace = true }

tungstenite = {
  version = "0.28",
  default-features = false,
  features = ["handshake"],
  optional = true
}
# vite feature only
ureq = { version = "3.3", default-features = false, optional = true }

[features]
default = []
devtools = ["dep:wabou-devtools"]
profiling = []
rust-hot-reload = ["dep:dioxus-devtools"]
# Shared deterministic mode used by backend-owned headless harnesses.
headless = []
# Live vite dev-server integration (module fetching + HMR). Step 2.
vite = ["dep:tungstenite", "dep:ureq"]

[dev-dependencies]
image = { workspace = true, features = ["png"] }
wabou-devtools = { workspace = true }
