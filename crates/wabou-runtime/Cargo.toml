[package]
name = "wabou-runtime"
version.workspace = true
edition = "2024"

license.workspace = true

[lib]
name = "wabou_runtime"
path = "src/lib.rs"

[dependencies]
anyrender.workspace = true
bitflags = { workspace = true }
bon = { workspace = true }
foyer = "0.22.3"
futures-lite = "2"
getrandom = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
jiff = { workspace = true }
lasso = "0.7.3"
open = { workspace = true }
parley = { workspace = true }
reqwest = {
  version = "0.13",
  default-features = false,
  features = ["rustls"]
}
rquickjs = {
  version = "0.12.1",
  features = ["full-async", "loader", "rust-alloc"]
}
rquickjs-serde = "0.6.1"
serde = { workspace = true, features = ["derive"] }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
slotmap = { workspace = true }
sourcemap = "9.2.2"
sys-locale = { workspace = true }
taffy = { workspace = true, features = ["content_size", "parse"] }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
tracing-chrome = { version = "0.7.2", optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
vello = { workspace = true }
wabou-bindgen = { workspace = true }
wabou-devtools = { workspace = true, optional = true }
wabou-host-api = { workspace = true }
wabou-shell = { workspace = true }
wabou-style = { workspace = true }
wabou-widgets = { workspace = true }

tungstenite = {
  version = "0.28",
  default-features = false,
  features = ["handshake"],
  optional = true
}
# vite feature only
ureq = { version = "3.3", optional = true }

[features]
default = []
devtools = ["dep:wabou-devtools"]
profiling = ["dep:tracing-chrome", "wabou-shell/profiling"]
renderer-skia = ["wabou-shell/renderer-skia"]
# Live vite dev-server integration (module fetching + HMR). Step 2.
vite = ["dep:tungstenite", "dep:ureq"]

[dev-dependencies]
image = { workspace = true, features = ["png"] }
tempfile = "3"
wabou-devtools = { workspace = true }
