[package]
name = "wabou-runtime-library"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
stabby = "=72.1.16"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
wabou-launch = { path = "../wabou-launch" }
wabou-runtime = { workspace = true, features = ["capability-modules", "vite", "devtools"] }
wabou-backend-vello-hybrid = { workspace = true, features = ["vite", "devtools"] }
wabou-bindgen = { workspace = true }
