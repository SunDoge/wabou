[package]
name = "wabou-legacy-terminal"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "Legacy winit/AnyRender terminal widget retained during the GPUI migration."

[dependencies]
anyrender.workspace = true
percent-encoding = "2"
rio-graphics = "0.5.5"
rio-vt = "0.5.5"
rustc-hash = "2"
serde_json = { workspace = true }
teletypewriter = "0.5.5"
tracing = { workspace = true }
vello = { workspace = true }
wabou-runtime = { workspace = true }
wabou-legacy-shell = { workspace = true }
wabou-shell-api = { workspace = true }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
wabou-host-api = { workspace = true }
