[package]
name = "wabou-shell-vello"
version.workspace = true
edition = "2024"

license.workspace = true
publish = false

[lib]
name = "wabou_shell_vello"
path = "src/lib.rs"

[dependencies]
arboard = { workspace = true }
bitflags = { workspace = true }
bytemuck.workspace = true
futures-util = "0.3"
glifo.workspace = true
image = { workspace = true, features = ["ico", "jpeg", "png", "webp"] }
lru = "0.18.1"
naga.workspace = true
notify-rust = { workspace = true }
open = { workspace = true }
parley = { workspace = true }
raw-window-handle = "0.6"
rfd = { workspace = true }
rustc-hash = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
slotmap = { workspace = true }
snafu = { workspace = true }
swash = { workspace = true }
taffy = { workspace = true, features = ["content_size", "parse"] }
tracing = { workspace = true }
unicode-segmentation = "1.12"
url = { workspace = true }
vello-common.workspace = true
vello-hybrid = { workspace = true, features = ["wgpu", "wgpu_default", "text"] }
wgpu.workspace = true
wgpu-context.workspace = true
winit = { workspace = true }
wabou-accessibility-vello = { workspace = true }
wabou-shell-api = { workspace = true }
wabou-style = { workspace = true }
wabou-svg-vello-hybrid.workspace = true

[features]
profiling = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[dev-dependencies]
tempfile = "3"
