[package]
name = "wabou-cli"
version.workspace = true
edition = "2024"
description = "Command-line development and packaging tools for Wabou applications"
license.workspace = true
repository = "https://github.com/SunDoge/wabou"

[[bin]]
name = "wabou"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
ctrlc = "3.5"
fs4 = "0.13.1"
process-wrap = { version = "9.1.0", features = ["std"] }
cargo-packager = { version = "0.11.8", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = "3"
toml = "0.9"
wabou-devtools = { workspace = true }
wabou-launch = { path = "../wabou-launch" }
wabou-backend-vello-hybrid = { workspace = true, features = ["devtools"], optional = true }
wabou-shell-vello = { workspace = true, optional = true }
wabou-widgets-vello = { workspace = true, optional = true }
wabou-shell-api.workspace = true

# Transitional native Rust frontend command adapter.
blockui-cli = { path = "../blockui-cli", optional = true }

[features]
# Existing source-checkout tooling keeps its commands. Distribution launchers
# can use --no-default-features without compiling either renderer implementation.
default = ["embedded-renderer", "native-ui"]
embedded-renderer = ["dep:wabou-backend-vello-hybrid", "dep:wabou-shell-vello", "dep:wabou-widgets-vello"]
native-ui = ["dep:blockui-cli"]
