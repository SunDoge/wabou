[package]
name = "wabou-cli"
version.workspace = true
edition = "2024"
description = "Command-line development and packaging tools for Wabou applications"
license.workspace = true
repository = "https://github.com/SunDoge/wabou"

[[bin]]
name = "wabou"
path = "src/main.rs"

[dependencies]
anyrender.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
ctrlc = "3.5"
fs4 = "0.13.1"
process-wrap = { version = "9.1.0", features = ["std"] }
cargo-packager = { version = "0.11.8", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = "3"
toml = "0.9"
wabou-devtools = { workspace = true }
wabou-runtime = { workspace = true, features = ["devtools"] }
wabou-legacy-runtime = { workspace = true, features = ["devtools"] }
wabou-backend-winit = { package = "wabou-legacy-shell", path = "../wabou-backend-winit" }
wabou-backend-winit-widgets = { package = "wabou-legacy-widgets", path = "../wabou-backend-winit-widgets" }
vello = { workspace = true }
