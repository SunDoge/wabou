[package]
name = "wabou-cli"
version.workspace = true
edition = "2024"
description = "Command-line development and packaging tools for Wabou applications"
license.workspace = true
repository = "https://github.com/SunDoge/wabou"

[[bin]]
name = "wabou"
path = "src/main.rs"

[[bin]]
name = "wabou-render"
path = "src/render_main.rs"
required-features = ["embedded-renderer"]

[dependencies]
usage-rs.workspace = true
ctrlc = "3.5"
fs4 = "0.13.1"
process-wrap = { version = "10.0.1", features = ["std"] }
cargo-packager = { version = "0.11.8", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = "3"
toml = "0.9"
wabou-devtools = { workspace = true }
wabou-launch = { path = "../wabou-launch" }
wabou-backend-vello-hybrid = { workspace = true, features = ["devtools"], optional = true }
wabou-shell-vello = { workspace = true, optional = true, features = ["widgets"] }
wabou-shell-api.workspace = true

wabou-runtime-library = { path = "../wabou-runtime-library", optional = true }

[features]
default = []
# The engine is isolated in the wabou-render helper. Normal CLI commands do not
# compile or link the renderer, QuickJS, Winit, or wgpu.
embedded-renderer = [
  "dep:wabou-backend-vello-hybrid",
  "dep:wabou-shell-vello",
  "dep:wabou-runtime-library",
]
