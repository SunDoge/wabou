[package]
name = "wabou-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line development and packaging tools for Wabou applications"
license.workspace = true
repository = "https://github.com/SunDoge/wabou"

[[bin]]
name = "wabou"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive", "env"] }
ctrlc = "3.5"
cargo-packager = { version = "0.11.8", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
wabou-devtools = { workspace = true }
wabou-quick = { workspace = true }
wabou-shell = { workspace = true }
vello = "0.9.0"
