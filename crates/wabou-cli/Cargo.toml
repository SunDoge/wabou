[package]
name = "wabou-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wabou"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive", "env"] }
ctrlc = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
wabou-devtools = { workspace = true }
wabou-quick = { workspace = true }
wabou-shell = { workspace = true }
vello = "0.9.0"
