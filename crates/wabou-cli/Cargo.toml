[package]
name = "wabou-cli"
version.workspace = true
edition = "2024"
description = "Command-line development and packaging tools for Wabou applications"
license.workspace = true
repository = "https://github.com/SunDoge/wabou"

[[bin]]
name = "wabou"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
ctrlc = "3.5"
fs4 = "1.1.0"
process-wrap = { version = "10.0.0", features = ["std"] }
cargo-packager = { version = "0.11.8", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = "3"
toml = "0.9"
wabou-devtools = { workspace = true }
wabou-launch = { path = "../wabou-launch" }
wabou-backend-vello-hybrid = { workspace = true, features = ["devtools"], optional = true }
wabou-shell-vello = { workspace = true, optional = true, features = ["widgets"] }
wabou-shell-api.workspace = true

# Transitional native Rust frontend command adapter.
blockui-cli = { path = "../../native/blockui-cli", optional = true }

wabou-runtime-library = { path = "../wabou-runtime-library", optional = true }

[features]
# QuickJS GUI tooling is the default. Experimental Rust UI is opt-in.
# External-runtime launchers can use --no-default-features.
default = ["embedded-renderer"]
embedded-renderer = ["dep:wabou-backend-vello-hybrid", "dep:wabou-shell-vello", "dep:wabou-runtime-library"]
native-ui = ["dep:blockui-cli"]
