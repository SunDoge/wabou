[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = [
  "experiments/*",
  "templates/basic",
  "vendor/bitwarden-sdk",
]
default-members = [
  "apps/gallery",
  "crates/wabou",
  "crates/wabou-bindgen",
  "crates/wabou-cli",
  "crates/wabou-devtools",
  "crates/wabou-host-api",
  "crates/wabou-motion",
  "crates/wabou-protocol",
  "crates/wabou-runtime",
  "crates/wabou-shell-api",
  "crates/wabou-shell",
  "crates/wabou-renderer",
  "crates/wabou-web",
  "crates/wabou-style",
  "crates/wabou-telemetry",
]

[workspace.package]
version = "0.1.0-alpha.4"
license = "Apache-2.0"

[workspace.dependencies]
wabou-telemetry = { path = "crates/wabou-telemetry" }
wabou = { path = "crates/wabou", default-features = false }
wabou-bindgen = { path = "crates/wabou-bindgen", default-features = false }
wabou-database = { path = "crates/wabou-database" }
wabou-devtools = { path = "crates/wabou-devtools", default-features = false }
wabou-host-api = { path = "crates/wabou-host-api" }
wabou-motion = { path = "crates/wabou-motion" }
wabou-pdf = { path = "crates/wabou-pdf" }
wabou-protocol = { path = "crates/wabou-protocol" }
wabou-renderer = { path = "crates/wabou-renderer" }
wabou-runtime = { path = "crates/wabou-runtime", default-features = false }
wabou-shell-api = { path = "crates/wabou-shell-api" }
wabou-shell = { path = "crates/wabou-shell" }
wabou-style = { path = "crates/wabou-style" }
wabou-terminal-widget = { path = "crates/wabou-terminal-widget" }
wabou-tray = { path = "crates/wabou-tray" }

arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
arc-swap = "1.9.2"
bitflags = "2.13.2"
bytemuck = "1.25.2"
usage-rs = "7.0.0"
directories = "6.0.0"
flume = "0.12.0"
glifo = "0.4"
getrandom = "0.4.3"
gix = { version = "0.87.1", default-features = false, features = ["sha1", "status"] }
gosh-dl = { version = "0.6.3", default-features = false, features = ["http", "storage", "torrent"] }
ignore = "0.4.33"
image = { version = "0.25", default-features = false }
jiff = "0.2.38"
lru = "0.18.5"
naga = { version = "30", features = ["wgsl-in"] }
notify-rust = "=4.18.2"
oar-ocr = "0.9.2"
open = "5.4.4"
parley = { version = "0.12", features = ["bytemuck", "complex-scripts"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rfd = "0.17.2"
serde = "1"
serde_ignored = "0.1.14"
serde_json = "1"
sha1 = "0.10.7"
sha2 = "0.10.9"
similar = "3.2.0"
slotmap = "1.1.1"
snafu = "0.9.2"
# Specta 2 is still pre-stable and its RC API is allowed to change. Keep the
# schema generator and derive macro on the version this workspace validates.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
sys-locale = "0.3.2"
taffy = "0.14.0"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2.2"
url = "2.5.8"
usvg = { version = "0.48.1", default-features = false, features = ["text"] }
uuid = "1"
vello-common = { package = "vello_common", version = "0.3.0" }
vello-gpu = { package = "vello_gpu", version = "0.3.0", default-features = false }
wgpu = "30"
wgpu-context = { package = "wgpu_context", version = "0.10.0" }
which = "6.0.3"
winit = "=0.31.0-beta.2"
zeroize = "1.9.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
