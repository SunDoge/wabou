[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = ["vendor/bitwarden-sdk"]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
wabou-accessibility = { path = "crates/wabou-accessibility" }
wabou-bindings = { path = "crates/wabou-bindings" }
wabou-database = { path = "crates/wabou-database" }
wabou-devtools = { path = "crates/wabou-devtools" }
wabou-host-api = { path = "crates/wabou-host-api" }
wabou-quick = { path = "crates/wabou-quick" }
wabou-shell = { path = "crates/wabou-shell" }
wabou-style = { path = "crates/wabou-style" }
wabou-terminal = { path = "crates/wabou-terminal" }
wabou-tray = { path = "crates/wabou-tray" }
wabou-widgets = { path = "crates/wabou-widgets" }

bitflags = "2.10.0"
bon = "3.9.3"
snafu = "0.9.2"
specta = { version = "1.0.5", features = ["functions"] }
taffy = "0.13.0"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
