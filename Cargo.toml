[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = [
  "experiments/*",
  "templates/basic",
  "vendor/bitwarden-sdk",
]
default-members = [
  "apps/7guis",
  "apps/devtools",
  "apps/gallery",
  "apps/hackernews",
  "apps/manga-ocr",
  "apps/motrix",
  "apps/pi-agent",
  "apps/stress",
  "apps/terminal",
  "apps/timestow",
  "apps/vlist",
  "crates/wabou",
  "crates/wabou-accessibility",
  "crates/wabou-accessibility-vello",
  "crates/wabou-backend-vello-hybrid",
  "crates/wabou-bindgen",
  "crates/wabou-cli",
  "crates/wabou-database",
  "crates/wabou-devtools",
  "crates/wabou-host-api",
  "crates/wabou-protocol",
  "crates/wabou-runtime",
  "crates/wabou-shell-api",
  "crates/wabou-shell-vello",
  "crates/wabou-style",
  "crates/wabou-svg-vello-hybrid",
  "crates/wabou-terminal-vello",
  "crates/wabou-tray",
  "crates/wabou-widgets-vello",
]

[workspace.package]
version = "0.1.0-alpha.3"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
wabou = { path = "crates/wabou", default-features = false }
wabou-accessibility = { path = "crates/wabou-accessibility" }
wabou-accessibility-vello = { path = "crates/wabou-accessibility-vello" }
wabou-backend-vello-hybrid = { path = "crates/wabou-backend-vello-hybrid" }
wabou-bindgen = { path = "crates/wabou-bindgen", default-features = false }
wabou-database = { path = "crates/wabou-database" }
wabou-devtools = { path = "crates/wabou-devtools", default-features = false }
wabou-host-api = { path = "crates/wabou-host-api" }
wabou-protocol = { path = "crates/wabou-protocol" }
wabou-runtime = { path = "crates/wabou-runtime", default-features = false }
wabou-shell-api = { path = "crates/wabou-shell-api" }
wabou-shell-vello = { path = "crates/wabou-shell-vello" }
wabou-style = { path = "crates/wabou-style" }
wabou-svg-vello-hybrid = { path = "crates/wabou-svg-vello-hybrid" }
wabou-terminal-vello = { path = "crates/wabou-terminal-vello" }
wabou-tray = { path = "crates/wabou-tray" }
wabou-widgets-vello = { path = "crates/wabou-widgets-vello" }

arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
arc-swap = "1.9.2"
bitflags = "2.10.0"
bon = "3.9.3"
bytemuck = "1.24.0"
clap = "4.6.4"
dioxus-devtools = { version = "0.7.10", default-features = false }
directories = "6.0.0"
flume = "0.12.0"
futures-channel = "0.3"
glifo = "0.3"
getrandom = "0.4.3"
gix = { version = "0.87.1", default-features = false, features = ["sha1", "status"] }
gosh-dl = { version = "0.5.0", default-features = false, features = ["http", "storage", "torrent"] }
ignore = "0.4.25"
image = { version = "0.25", default-features = false }
jiff = "0.2.35"
lyon_tessellation = "1"
naga = { version = "29.0.4", features = ["wgsl-in"] }
notify-rust = "=4.11.7"
oar-ocr = "0.9.2"
open = "5.4.0"
parley = { version = "0.10", features = ["complex-scripts"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rfd = "0.17.2"
serde = "1"
serde_ignored = "0.1.14"
serde_json = "1"
sha1 = "0.10.6"
sha2 = "0.10.9"
similar = "3.2.0"
slotmap = "1.1.1"
snafu = "0.9.2"
# Specta 2 is still pre-stable and its RC API is allowed to change. Keep the
# schema generator and derive macro on the version this workspace validates.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
swash = "0.2.10"
sys-locale = "0.3.2"
taffy = "0.14.0"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
trash = "5.2.6"
unicode-width = "0.2.2"
url = "2.5.8"
usvg = { version = "0.48.1", default-features = false, features = ["text"] }
uuid = "1"
vello-common = { package = "vello_common", version = "0.2.0" }
vello-hybrid = { package = "vello_hybrid", version = "0.2.0", default-features = false }
wgpu = "29"
wgpu-context = { package = "wgpu_context", version = "0.9.0" }
which = "6.0.3"
winit = "=0.31.0-beta.2"
zeroize = "1.9.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
