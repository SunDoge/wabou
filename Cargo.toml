[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = ["vendor/bitwarden-sdk"]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
wabou-accessibility = { path = "crates/wabou-accessibility" }
wabou-devtools = { path = "crates/wabou-devtools" }
wabou-quick = { path = "crates/wabou-quick" }
wabou-shell = { path = "crates/wabou-shell" }
wabou-style = { path = "crates/wabou-style" }
wabou-terminal = { path = "crates/wabou-terminal" }

bitflags = "2.10.0"
bon = "3.9.3"
snafu = "0.9.2"
taffy = "0.12.2"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

# Vaultwarden may emit both PascalCase and camelCase identity fields. The
# generated upstream aliases treat those as duplicate fields, so pin a minimal
# generated-client patch while retaining the SDK's exact 3.0.0 API surface.
[patch."https://github.com/bitwarden/sdk-internal.git"]
bitwarden-api-base = { path = "vendor/bitwarden-sdk/bitwarden-api-base" }
bitwarden-api-identity = { path = "vendor/bitwarden-sdk/bitwarden-api-identity" }
bitwarden-core = { path = "vendor/bitwarden-sdk/bitwarden-core" }
