<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 640px; height: 420px; margin: 0; overflow: hidden; }
      body { position: relative; background: #f7f8fa; }
      .box { position: absolute; }
      .solid { left: 40px; top: 40px; width: 112px; height: 80px; background: #2563eb; }
      .alpha-base { left: 192px; top: 40px; width: 112px; height: 80px; background: #2563eb; }
      .alpha-over { left: 232px; top: 60px; width: 80px; height: 64px; background: rgba(220, 38, 38, 0.502); }
      .clip { left: 40px; top: 160px; width: 144px; height: 96px; overflow: hidden; border: 2px solid #c5cbd3; border-radius: 16px; background: #fff; }
      .clip-child { left: 80px; top: 48px; width: 96px; height: 80px; background: #14b8a6; }
      .shadow { left: 224px; top: 160px; width: 160px; height: 96px; border: 1px solid #dfe3e8; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.039), 0 1px 2px rgba(0, 0, 0, 0.078), 0 4px 10px -2px rgba(0, 0, 0, 0.063); }
      .translucent { left: 40px; top: 288px; width: 384px; height: 64px; border-radius: 12px; background: rgba(17, 24, 39, 0.251); }
    </style>
  </head>
  <body>
    <div class="box solid"></div>
    <div class="box alpha-base"></div>
    <div class="box alpha-over"></div>
    <div class="box clip"><div class="box clip-child"></div></div>
    <div class="box shadow"></div>
    <div class="box translucent"></div>
  </body>
</html>
