version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # These upgrades need native adapter/upstream renderer migrations.
    ignore:
      # Keep major upgrades in human-owned branches so Dependabot PRs remain
      # reviewable dependency-only changes.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # These pre-1.0 minor releases contain breaking renderer API changes and
      # need accesskit and accesskit_xplat to be migrated together.
      - dependency-name: accesskit
        update-types:
          - version-update:semver-minor
      - dependency-name: accesskit_xplat
        update-types:
          - version-update:semver-minor
      - dependency-name: winit
        versions: ["0.31.0-beta.3"]
    groups:
      rust-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Use Bun's updater to keep workspace package.json files and bun.lock in sync.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Major upgrades need migration work and should not open permanently-red
      # dependency-only PRs.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # These packages are bundled into checked-in QuickJS runtime artifacts.
      # Updating them requires running codegen and reviewing the generated
      # runtime in a human-owned branch, which Dependabot cannot do.
      - dependency-name: motion-dom
      - dependency-name: solid-js
      - dependency-name: "@solidjs/universal"
      - dependency-name: "@solidjs/web"
    groups:
      solid-runtime:
        applies-to: version-updates
        patterns:
          - solid-js
          - "@solidjs/universal"
          - "@solidjs/web"
          - "@solidjs/vite-plugin"
      javascript-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      javascript-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
