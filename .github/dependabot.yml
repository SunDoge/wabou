version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # These upgrades need native adapter/upstream renderer migrations.
    ignore:
      - dependency-name: winit
        versions: ["0.31.0-beta.3"]
      - dependency-name: wgpu
        versions: [">=30, <31"]
      - dependency-name: wgpu_context
        versions: [">=0.10, <0.11"]
    groups:
      rust-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Use Bun's updater to keep workspace package.json files and bun.lock in sync.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      solid-runtime:
        applies-to: version-updates
        patterns:
          - solid-js
          - "@solidjs/universal"
          - "@solidjs/web"
          - "@solidjs/vite-plugin"
      javascript-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      javascript-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
