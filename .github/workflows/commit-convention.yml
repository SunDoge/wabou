name: Commit convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [dev, main, master]

permissions:
  contents: read

jobs:
  pull-request-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|test|docs|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+'
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "Invalid pull-request title: $PR_TITLE"
            echo "Expected: <type>(<optional-scope>): <description>"
            exit 1
          fi

  main-history:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Validate pushed commit title
        run: |
          if [ "$(git show -s --format=%P HEAD | wc -w)" -gt 1 ]; then
            echo "Skipping Git merge commit $(git rev-parse --short HEAD)"
            exit 0
          fi

          subject=$(git log -1 --pretty=%s)
          pattern='^(feat|fix|refactor|perf|test|docs|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+'
          if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
            echo "Invalid commit title: $subject"
            echo "Expected: <type>(<optional-scope>): <description>"
            exit 1
          fi
