name: CI

on:
  pull_request:
  push:
    branches: [dev, main, master]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build JavaScript packages
        run: bun run packages:build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Check TypeScript bindings
        run: |
          cargo run -p wabou-host-api --features bindings --example native-host-bindings -- check
          cargo run -p wabou-cli -- bindings check apps/gallery
          cargo run -p wabou-cli -- bindings check apps/devtools

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Test native application behavior
        run: |
          cargo run -p wabou-cli -- test apps/gallery/tests/behavior.ts --app apps/gallery
          cargo run -p wabou-cli -- test \
            --replay target/wabou-test/gallery/artifacts/trace.json \
            --app apps/gallery
          cargo run -p wabou-cli -- test apps/7guis/tests/behavior.ts --app apps/7guis
          cargo run -p wabou-cli -- test apps/vlist/tests/behavior.ts --app apps/vlist

      - name: Upload behavior-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-test-diagnostics
          path: |
            target/wabou-test/*/artifacts/
            target/wabou-test/*/replay-artifacts/
          if-no-files-found: ignore

      - name: Test standalone project scaffold
        run: |
          scaffold_root="$(mktemp -d)/hello-wabou"
          cargo run -p wabou-cli -- new "$scaffold_root" \
            --wabou-repository "$GITHUB_WORKSPACE" \
            --wabou-ref "$GITHUB_SHA"
          bun install --cwd "$scaffold_root"
          bun run --cwd "$scaffold_root" check
          bun run --cwd "$scaffold_root" build
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo check --manifest-path "$scaffold_root/Cargo.toml"
          test "$(git -C "$scaffold_root/vendor/wabou" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Render gallery at 1x and 2x
        run: |
          cargo run -p wabou-cli -- render apps/gallery --out target/gallery-1x.png --width 800 --height 600 --scale-factor 1
          cargo run -p wabou-cli -- render apps/gallery --out target/gallery-2x.png --width 800 --height 600 --scale-factor 2
          test -s target/gallery-1x.png
          test -s target/gallery-2x.png

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run packages:build

      - name: Check types
        run: bun run check

      - name: Check package boundaries
        run: bun run packages:check

      - name: Check publish tarballs
        run: bun run scripts/publish-packages.ts --dry-run

      - name: Test packages
        run: bun --conditions=browser test packages

      - name: Test reactive router integration
        run: bun run test:router

      - name: Build application frontends
        run: |
          bun run --cwd apps/gallery build
          bun run --cwd apps/hackernews build

      - name: Report application bundle sizes
        run: |
          bun run size:report -- \
            dist/gallery/resources/bundle.js \
            dist/hackernews/resources/bundle.js

      - name: Check generated artifacts
        run: bun run gen:check
