name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Check TypeScript bindings
        run: |
          cargo run -p wabou-host-api --features bindings --example native-host-bindings -- check
          cargo run -p wabou-cli -- bindings --app-dir apps/gallery check
          cargo run -p wabou-cli -- bindings --app-dir apps/devtools check
          cargo run -p wabou-cli -- bindings --app-dir apps/warden-desktop check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Test native behavior runner
        run: >-
          cargo run -p wabou-cli -- test --app-dir apps/warden-desktop
          apps/warden-desktop/tests/close-to-tray.test.ts

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check

      - name: Check package boundaries
        run: bun run packages:check

      - name: Check publish tarballs
        run: bun run scripts/publish-packages.ts --dry-run

      - name: Test packages
        run: bun --conditions=browser test packages

      - name: Test reactive router integration
        run: bun run test:router

      - name: Build application frontends
        run: |
          bun --cwd apps/gallery run build
          bun --cwd apps/hackernews run build

      - name: Check generated artifacts
        run: |
          bun run gen
          git diff --exit-code
