name: CI

on:
  pull_request:
  push:
    branches: [dev, main, master]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build JavaScript packages
        run: bun run packages:build

      - name: Verify Rust workspace
        run: bun run verify:rust

      - name: Check lightweight runtime dependency graph
        run: |
          # Gallery and DevTools enable the Specta exporter. Check the ordinary
          # runtime/facade dependency path independently of workspace features.
          cargo check -p wabou-bindgen --no-default-features
          cargo check -p wabou-runtime --no-default-features
          cargo check -p wabou --no-default-features
          for package in wabou-runtime wabou; do
            if cargo tree -p "$package" -e normal | grep -Fq 'specta v'; then
              echo "$package default dependency graph unexpectedly contains Specta" >&2
              exit 1
            fi
          done

      - name: Check TypeScript bindings
        run: |
          cargo run -p wabou-host-api --features bindings --example native-host-bindings -- check
          cargo run -p wabou-cli -- bindings check apps/gallery
          cargo run -p wabou-cli -- bindings check apps/devtools

      - name: Test native application behavior
        run: |
          bun run verify:behavior
          cargo run -p wabou-cli -- test \
            --replay target/wabou-test/gallery/artifacts/trace.json \
            --app apps/gallery
          WABOU_MOTRIX_TEST_ENGINE_FAILURE=1 cargo run -p wabou-cli -- test \
            apps/motrix/tests/engine-failure.scenario.ts \
            --artifacts target/wabou-test/motrix/engine-failure-artifacts

      - name: Upload behavior-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-test-diagnostics
          path: |
            target/wabou-test/*/artifacts/
            target/wabou-test/*/replay-artifacts/
            target/wabou-test/*/*-artifacts/
          if-no-files-found: ignore

      - name: Test standalone project scaffold
        run: |
          scaffold_root="$(mktemp -d)/hello-wabou"
          cargo run -p wabou-cli -- new "$scaffold_root" \
            --wabou-repository "$GITHUB_WORKSPACE" \
            --wabou-ref "$GITHUB_SHA"
          install_log="$(mktemp)"
          bun install --cwd "$scaffold_root" 2>&1 | tee "$install_log"
          if grep -Fq "warn: incorrect peer dependency" "$install_log"; then
            echo "standalone scaffold has invalid peer dependencies" >&2
            exit 1
          fi
          PATH="$GITHUB_WORKSPACE/target/debug:$PATH" \
            bun run --cwd "$scaffold_root" check
          bun run --cwd "$scaffold_root" build
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo check --manifest-path "$scaffold_root/Cargo.toml"
          test "$(git -C "$scaffold_root/vendor/wabou" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Render gallery at 1x and 2x
        run: |
          cargo run -p wabou-cli -- render apps/gallery --out target/gallery-1x.png --width 800 --height 600 --scale-factor 1
          cargo run -p wabou-cli -- render apps/gallery --out target/gallery-2x.png --width 800 --height 600 --scale-factor 2
          test -s target/gallery-1x.png
          test -s target/gallery-2x.png

      - name: Record headless performance diagnostics
        run: |
          cargo run -p wabou-cli -- render apps/gallery \
            --out target/perf/gallery.png --width 1200 --height 800 \
            --metrics target/perf/gallery.json --samples 20
          cargo run -p wabou-cli -- render apps/vlist \
            --out target/perf/vlist.png --width 1200 --height 800 \
            --metrics target/perf/vlist.json --samples 20
          cargo run -p wabou-cli -- render apps/stress \
            --out target/perf/stress.png --width 1200 --height 800 \
            --metrics target/perf/stress.json --samples 20
          bun run perf:report -- target/perf/gallery.json target/perf/vlist.json target/perf/stress.json

      - name: Upload performance diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: headless-performance-diagnostics
          path: target/perf/*.json

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run packages:build

      - name: Verify JavaScript workspace
        run: bun run verify:js

      - name: Build application frontends
        run: |
          bun run --cwd apps/gallery build
          bun run --cwd apps/hackernews build

      - name: Report application bundle sizes
        run: |
          bun run size:report -- \
            dist/gallery/resources/bundle.js \
            dist/hackernews/resources/bundle.js
