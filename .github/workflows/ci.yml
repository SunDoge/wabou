name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev, main, master]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          # Keep warnings-as-errors scoped to the explicit Clippy command
          # below. Applying -D warnings through RUSTFLAGS would also
          # fail bindings, layout, packaging, and ordinary test compilation.
          rustflags: ""
          cache: ${{ !env.ACT }}

      - name: Install Bun
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install JavaScript dependencies
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: bun install --frozen-lockfile

      - name: Build JavaScript packages
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: bun run packages:build

      - name: Verify Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --lib --bins --tests --all-features -- -D warnings
          # Run the same feature set Clippy just compiled. Binding drift is
          # asserted by library tests, so CI does not need to link and execute
          # four separate generator examples afterwards.
          cargo test --lib --all-features

      - name: Check lightweight runtime dependency graph
        # This graph changes only with Cargo manifests/lockfiles. Keep it in
        # full tag/manual validation instead of paying for a second feature-set
        # build on every pull-request revision and development push.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          # Gallery and DevTools enable the Specta exporter. Check the ordinary
          # runtime/facade dependency path independently of workspace features.
          cargo check -p wabou-bindgen --no-default-features
          cargo check -p wabou-runtime --no-default-features
          cargo check -p wabou --no-default-features
          for package in wabou-runtime wabou; do
            if cargo tree -p "$package" -e normal | grep -Fq 'specta v'; then
              echo "$package default dependency graph unexpectedly contains Specta" >&2
              exit 1
            fi
          done

      - name: Verify native behavior
        # Native application scenarios compile the CLI and each application
        # host, so reserve the exhaustive suite for releases and explicit runs.
        # `bun run verify` remains the full local pre-release command.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: bun run verify:behavior

      - name: Verify component layout
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          WABOU_LAYOUT_COMMAND: target/debug/wabou
        run: |
          # Native behavior already built the debug CLI. This is normally a
          # no-op, but makes the layout step independently reproducible.
          cargo build -p wabou-cli
          bun run test:layout:quick

      - name: Upload native-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-diagnostics
          path: |
            target/wabou-test/*/artifacts/
            target/wabou-test/*/replay-artifacts/
            target/wabou-test/*/*-artifacts/
          if-no-files-found: ignore

  linux-package:
    name: Linux package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
          cache: ${{ !env.ACT }}
          cache-shared-key: linux-package

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build JavaScript packages
        run: bun run packages:build

      - name: Build 7GUIs AppImage
        run: bun run wabou package apps/7guis

      - name: Verify AppImage contents
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(dist/7guis/bundles/*.AppImage)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "expected exactly one 7GUIs AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi
          appimage=$(realpath "${appimages[0]}")
          extract_dir=$(mktemp -d)
          cd "$extract_dir"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/seven-guis
          test -s squashfs-root/usr/lib/seven-guis/resources/bundle.js
          cmp \
            "$GITHUB_WORKSPACE/dist/7guis/release/resources/bundle.js" \
            squashfs-root/usr/lib/seven-guis/resources/bundle.js

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: seven-guis-appimage
          path: dist/7guis/bundles/*.AppImage
          if-no-files-found: error

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run packages:build

      - name: Verify JavaScript workspace
        run: bun run verify:js

      - name: Build application frontends
        run: |
          bun run --cwd apps/gallery build
          bun run --cwd apps/hackernews build

      - name: Report application bundle sizes
        run: |
          bun run size:report -- \
            dist/gallery/resources/bundle.js \
            dist/hackernews/resources/bundle.js
