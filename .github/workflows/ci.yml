name: CI

on:
  pull_request:
  push:
    branches: [dev, main, master]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: ${{ !env.ACT }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build JavaScript packages
        run: bun run packages:build

      - name: Verify Rust workspace
        run: bun run verify:ci:rust

      - name: Check lightweight runtime dependency graph
        run: |
          # Gallery and DevTools enable the Specta exporter. Check the ordinary
          # runtime/facade dependency path independently of workspace features.
          cargo check -p wabou-bindgen --no-default-features
          cargo check -p wabou-runtime --no-default-features
          cargo check -p wabou --no-default-features
          for package in wabou-runtime wabou; do
            if cargo tree -p "$package" -e normal | grep -Fq 'specta v'; then
              echo "$package default dependency graph unexpectedly contains Specta" >&2
              exit 1
            fi
          done

      - name: Check TypeScript bindings
        run: bun run bindings:check

      - name: Test native application behavior
        run: bun run verify:behavior

      - name: Test component layout contracts
        run: bun run verify:layout

      - name: Upload behavior-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-test-diagnostics
          path: |
            target/wabou-test/*/artifacts/
            target/wabou-test/*/replay-artifacts/
            target/wabou-test/*/*-artifacts/
          if-no-files-found: ignore

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run packages:build

      - name: Verify JavaScript workspace
        run: bun run verify:js

      - name: Build application frontends
        run: |
          bun run --cwd apps/gallery build
          bun run --cwd apps/hackernews build

      - name: Report application bundle sizes
        run: |
          bun run size:report -- \
            dist/gallery/resources/bundle.js \
            dist/hackernews/resources/bundle.js
