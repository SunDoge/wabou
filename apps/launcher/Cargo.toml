[package]
name = "wabou-launcher"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "wabou-launcher"
path = "src/main.rs"

[dependencies]
flume.workspace = true
global-hotkey = "0.8.0"
rquickjs = { version = "0.14.0", features = ["macro"] }
serde = { workspace = true, features = ["derive"] }
snafu.workspace = true
tracing.workspace = true
wabou = { workspace = true, features = ["tray"] }

[dev-dependencies]
tempfile = "3"
