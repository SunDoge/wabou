[package]
name = "wabou-devtools-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wabou-devtools"
path = "src/main.rs"

[[example]]
name = "wabou-devtools-bindgen"
path = "examples/wabou-bindgen.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
snafu = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
wabou-devtools = { workspace = true, features = ["bindings"] }
wabou = { workspace = true, features = ["bindings"] }
