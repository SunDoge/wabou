[package]
name = "wabou-devtools-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wabou-devtools"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
snafu = { workspace = true }
serde_json = "1"
specta = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
wabou-bindings = { workspace = true }
wabou-devtools = { workspace = true, features = ["bindings"] }
wabou-quick = { workspace = true }
