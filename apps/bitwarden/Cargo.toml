[package]
name = "bitwarden-demo"
version = "0.1.0"
edition = "2024"
# The demo links Bitwarden's GPL Password Manager SDK. Wabou's own crates
# remain Apache-2.0; this application binary is distributed under GPL-3.0.
license = "GPL-3.0-only"

[dependencies]
arboard = "3.6.1"
async-trait = "0.1.91"
bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-core = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e", features = ["internal"] }
bitwarden-crypto-sync-handler = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-pm = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-sync = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-vault = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
blake3 = "1.8.2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
url = "2.5.8"
uuid = "1"
wabou-quick = { workspace = true }
wabou-shell = { workspace = true }
zeroize = "1.9.0"

[[bin]]
name = "bitwarden-demo"
path = "src/main.rs"
