[package]
name = "seven-guis"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "seven-guis"
path = "src/main.rs"

[features]
default = ["vello-hybrid"]
gpui = ["wabou/gpui"]
vello-hybrid = ["wabou/vello-hybrid"]

[dependencies]
snafu = { workspace = true }
wabou = { workspace = true, default-features = false }
