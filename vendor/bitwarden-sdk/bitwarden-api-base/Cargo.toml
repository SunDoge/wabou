[package]
name = "bitwarden-api-base"
description = """
Internal crate for the bitwarden crate. Do not use.
"""

version = "3.0.0"
authors = ["Bitwarden Inc"]
edition = "2024"
rust-version = "1.88.0"
homepage = "https://bitwarden.com"
repository = "https://github.com/bitwarden/sdk-internal"
license = "GPL-3.0-only OR LicenseRef-Bitwarden-SDK"
keywords = ["bitwarden"]

[features]
uniffi = ["dep:bitwarden-uniffi-error", "dep:uniffi"]

[dependencies]
bitwarden-uniffi-error = { version = "=3.0.0", optional = true }
http = ">=1.4.0, <2"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "http2", "form", "query"] }
reqwest-middleware = { version = "0.5.1", features = ["json", "multipart", "form", "query"] }
serde = { version = ">=1.0, <2.0", features = ["derive"] }
serde_json = ">=1.0.96, <2.0"
uniffi = { version = "=0.31.0", optional = true }
url = ">=2.5, <3"

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
# By default, we use rustls as the TLS stack and rustls-platform-verifier to support user-installed root certificates
# The only exception is WASM, as it just uses the browsers/node fetch
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "http2", "form", "query", "rustls-no-provider"] }
rustls = { version = "0.23.27", default-features = false, features = ["std", "tls12", "logging", "ring"] }
rustls-platform-verifier = "0.6.2"
