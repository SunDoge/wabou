[workspace]
resolver = "2"
members = ["bitwarden-api-base", "bitwarden-api-identity", "bitwarden-core"]

[workspace.package]
version = "3.0.0"
authors = ["Bitwarden Inc"]
edition = "2024"
rust-version = "1.88.0"
homepage = "https://bitwarden.com"
repository = "https://github.com/bitwarden/sdk-internal"
license-file = "LICENSE"
readme = "DISCLAIMER.md"
keywords = ["bitwarden"]

[workspace.dependencies]
async-trait = ">=0.1.80, <0.2"
bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-api-base = { path = "bitwarden-api-base", version = "=3.0.0" }
bitwarden-api-identity = { path = "bitwarden-api-identity", version = "=3.0.0" }
bitwarden-api-key-connector = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-core-macro = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-encoding = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-error = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-logging = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-random = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-state = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-state-bridge-macro = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-test = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-threading = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-uniffi-error = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-uuid = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
chrono = { version = ">=0.4.26, <0.5", default-features = false, features = ["clock", "serde", "std"] }
http = ">=1.4.0, <2.0"
mockall = ">=0.13.1, <0.16"
rand = ">=0.10.0, <0.11"
rand_chacha = ">=0.10.0, <0.11"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "http2", "form", "query"] }
reqwest-middleware = { version = "0.5.1", features = ["json", "multipart", "form", "query"] }
rustls = { version = "0.23.27", default-features = false, features = ["std", "tls12", "logging", "ring"] }
rustls-platform-verifier = "0.6.2"
schemars = { version = ">=1.0.0, <2.0", features = ["uuid1", "chrono04"] }
serde = { version = ">=1.0, <2.0", features = ["derive"] }
serde-wasm-bindgen = ">=0.6.0, <0.7"
serde_bytes = ">=0.11.17, <0.12.0"
serde_json = ">=1.0.96, <2.0"
serde_qs = ">=0.12.0, <0.16"
serde_repr = ">=0.1.12, <0.2"
thiserror = ">=1.0.40, <3"
tokio = { version = "1.36.0", features = ["macros"] }
tracing = "0.1.41"
tsify = { version = ">=0.5.5, <0.6", features = ["js"] }
uniffi = "=0.31.0"
url = ">=2.5.8, <3.0"
uuid = { version = ">=1.3.3, <2.0", features = ["serde", "v4", "js"] }
wasm-bindgen = { version = "=0.2.114", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.64"
wiremock = ">=0.6.0, <0.7"
zeroize = ">=1.7.0, <2.0"
zxcvbn = ">=3.0.1, <4.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
