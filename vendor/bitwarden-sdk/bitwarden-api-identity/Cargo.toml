[package]
name = "bitwarden-api-identity"
description = "Api bindings for the Bitwarden Identity API."
categories = ["api-bindings"]

version = "3.0.0"
authors = ["Bitwarden Inc"]
edition = "2024"
rust-version = "1.88.0"
homepage = "https://bitwarden.com"
repository = "https://github.com/bitwarden/sdk-internal"
license = "GPL-3.0-only OR LicenseRef-Bitwarden-SDK"
keywords = ["bitwarden"]

[features]
mockall = ["dep:mockall"]

[dependencies]
async-trait = ">=0.1.80, <0.2"
bitwarden-api-base = { path = "../bitwarden-api-base", version = "=3.0.0" }
mockall = { version = ">=0.13.1, <0.16", optional = true }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "http2", "form", "query"] }
reqwest-middleware = { version = "0.5.1", features = ["json", "multipart", "form", "query"] }
serde = { version = ">=1.0, <2.0", features = ["derive"] }
serde_json = ">=1.0.96, <2.0"
serde_with = { version = ">=3.8, <4", default-features = false, features = [
    "base64",
    "std",
    "macros",
] }
url = ">=2.5, <3"
uuid = { version = ">=1.13.1, <2", features = ["serde", "v4"] }
